<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f9; display:flex; justify-content:center; padding:40px; }
        .container { background:#fff; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:600px; }
        h1 { text-align:center; color:#333; }
        textarea { width:100%; height:150px; padding:10px; font-size:14px; border-radius:6px; border:1px solid #ccc; box-sizing: border-box; }
        button { margin-top:15px; width:100%; padding:12px; background:#4CAF50; color:#fff; border:none; border-radius:6px; font-size:16px; cursor:pointer; }
        button:hover { background:#45a049; }
        .result { margin-top:20px; padding:15px; border-radius:6px; font-weight:bold; text-align:center; }
        .real { background:#d4edda; color:#155724; }
        .fake { background:#f8d7da; color:#721c24; }
        .conf { font-size:13px; font-weight:normal; display:block; margin-top:5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Fake News Detector</h1>
        <form method="POST" action="/">
            <textarea name="news_text" placeholder="Paste news article text here..." required>{{ text or '' }}</textarea>
            <button type="submit">Analyze</button>
        </form>
        {% if result %}
        <div class="result {{ 'real' if result == 'Real News' else 'fake' }}">
            {{ result }} 
            <span class="conf">Confidence: {{ confidence }}%</span>
        </div>
        {% endif %}
    </div>
</body>
</html>
